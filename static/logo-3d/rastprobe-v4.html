const W=canvas.width,H=canvas.height,frame=ctx.createImageData(W,H),pixels=frame.data,depths=new Float32Array(W*H).fill(-Infinity);
for(const [a,b,c,,rgb] of tris){
 const ax=a[0]*r,ay=a[1]*r,bx=b[0]*r,by=b[1]*r,cx=c[0]*r,cy=c[1]*r;
 const minX=Math.max(0,Math.floor(Math.min(ax,bx,cx))),maxX=Math.min(W-1,Math.ceil(Math.max(ax,bx,cx)));
 const minY=Math.max(0,Math.floor(Math.min(ay,by,cy))),maxY=Math.min(H-1,Math.ceil(Math.max(ay,by,cy)));
 const det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
 for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
  const u=((by-cy)*(x+.5-cx)+(cx-bx)*(y+.5-cy))/det,v=((cy-ay)*(x+.5-cx)+(ax-cx)*(y+.5-cy))/det,w=1-u-v;
  if(Math.min(u,v,w)<-1e-6)continue;
  const z=u*a[2]+v*b[2]+w*c[2],i=y*W+x;if(z<depths[i])continue;depths[i]=z;
  pixels[4*i]=rgb[0];pixels[4*i+1]=rgb[1];pixels[4*i+2]=rgb[2];pixels[4*i+3]=255
 }
}
ctx.putImageData(frame,0,0);
}
